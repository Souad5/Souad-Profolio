    <script>
      // Apply theme preferences before React mounts to avoid a flash of the
      // default theme: the public theme on the portfolio, and the admin UI's
      // own theme + font size on /admin (the two never touch each other).
      (function () {
        try {
          var prefs = JSON.parse(
            localStorage.getItem("admin:preferences") || "{}",
          );
          var theme = prefs.theme || "system";
          var dark =
            theme === "dark" ||
            (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var root = document.documentElement;
          if (window.location.pathname.indexOf("/admin") !== 0) {
            // Public site: apply the saved theme before first paint so dark
            // visitors don't see a flash of the light theme (ThemeContext
            // otherwise only applies it after React mounts).
            var pub = localStorage.getItem("portfolio_theme") || "system";
            var pubDark =
              pub === "dark" ||
              (pub === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
            root.classList.add(pubDark ? "dark" : "light");
          }
          if (window.location.pathname.indexOf("/admin") === 0) {
            root.setAttribute(
              "data-admin-theme",
              dark ? "dark" : "light",
            );
            root.setAttribute(
              "data-admin-font-scale",
              prefs.fontScale || "md",
            );
          }
        } catch (e) {
          /* ignore — fall back to defaults */
        }
      })();
    </script>
